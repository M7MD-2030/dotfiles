[core]
plugins = ipc ipc-rules autostart vswipe command foreign-toplevel grid idle move resize place shortcuts-inhibit vswitch wm-actions session-lock xdg-activation
preferred_decoration_mode = client
xwayland = false
vwidth = 10
vheight = 1
close_top_view = <super> KEY_Q
exit = <super> <shift> KEY_E
background_color = \#000000FF

[input]
xkb_layout = us,ara
xkb_options = grp:win_space_toggle
tap_to_click = true
natural_scroll = true
disable_touchpad_while_typing = true

[autostart]
env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
autostart_wf_shell = false
bar = waybar
kblang = ~/.config/wm/kblang.py
notify = mako
wall = swaybg -i ~/Pictures/Wallpapers/wallpaper.jpg -m fill
idle = swayidle -w timeout 600 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'
clip = env QT_QPA_PLATFORM=wayland copyq --start-server
switcher = wswitch --daemon

[idle]
dpms_timeout = 900
screensaver_timeout = -1

[grid]
duration = 0
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT

[wm-actions]
toggle_fullscreen = <super> KEY_F

[shortcuts-inhibit]
break_grab = <super> KEY_ESC

[vswitch]
wraparound = true
duration = 0
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
binding_10 = <super> KEY_0
send_win_1 = <super> <shift> KEY_1
send_win_2 = <super> <shift> KEY_2
send_win_3 = <super> <shift> KEY_3
send_win_4 = <super> <shift> KEY_4
send_win_5 = <super> <shift> KEY_5
send_win_6 = <super> <shift> KEY_6
send_win_7 = <super> <shift> KEY_7
send_win_8 = <super> <shift> KEY_8
send_win_9 = <super> <shift> KEY_9
send_win_10 = <super> <shift> KEY_0
binding_left = <super> <ctrl> KEY_LEFT
binding_right = <super> <ctrl> KEY_RIGHT
binding_up = <super> <ctrl> KEY_UP
binding_down = <super> <ctrl> KEY_DOWN
with_win_left = <super> <ctrl> <shift> KEY_LEFT
with_win_right = <super> <ctrl> <shift> KEY_RIGHT
with_win_up = <super> <ctrl> <shift> KEY_UP
with_win_down = <super> <ctrl> <shift> KEY_DOWN
send_win_left = <super> <ctrl> <alt> KEY_LEFT
send_win_right = <super> <ctrl> <alt> KEY_RIGHT
send_win_up = <super> <ctrl> <alt> KEY_UP
send_win_down = <super> <ctrl> <alt> KEY_DOWN

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = xfce4-terminal
binding_browser = <super> KEY_B
command_browser = firefox
binding_copyq = <super> KEY_C
command_copyq = copyq toggle
binding_lock = <super> <shift> KEY_L
command_lock = swaylock -f -c 000000
binding_suspend = <super> <shift> KEY_S
command_suspend = systemctl suspend
binding_shot = KEY_SYSRQ
command_shot = ~/.config/wm/screenshot.sh area
binding_shotfull = <shift> KEY_SYSRQ
command_shotfull = ~/.config/wm/screenshot.sh full
binding_mute = KEY_MUTE
command_mute = ~/.config/wm/osd.sh vol-mute
binding_micmute = KEY_MICMUTE
command_micmute = ~/.config/wm/osd.sh mic-mute
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = ~/.config/wm/osd.sh vol-up
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = ~/.config/wm/osd.sh vol-down
repeatable_binding_brup = KEY_BRIGHTNESSUP
command_brup = ~/.config/wm/osd.sh br-up
repeatable_binding_brdown = KEY_BRIGHTNESSDOWN
command_brdown = ~/.config/wm/osd.sh br-down
binding_alttab = <alt> KEY_TAB
command_alttab = wswitch next
binding_alttab_back = <alt> <shift> KEY_TAB
command_alttab_back = wswitch prev

[vswipe]
enable_horizontal = true
enable_vertical = false
fingers = 3
