# Timeline + video title — everything else off
disable_elements=window_border,controls,volume,idle_indicator,audio_indicator,pause_indicator
controls=never
volume=none

# Title bar: shows the video name, no buttons
top_bar=always
top_bar_title=yes
top_bar_controls=no
top_bar_flash_on=video,audio

# Timeline look + chapters
timeline_style=bar
timeline_line_width=2
timeline_size=36
timeline_border=0
timeline_heatmap=no
timeline_step=5
timeline_persistency=paused
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80
progress=never

# Show on ANY mouse movement, hide when the cursor hides
autohide=yes
proximity_in=10000
proximity_out=10000

# Style
animation_duration=120
border_radius=8
font_bold=yes
destination_time=time-remaining
opacity=timeline=0.75,chapters=1,menu=0.95,title=1,playlist_position=1
color=foreground=69c5ff,foreground_text=000000
