font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
disable_ligatures never
font_features     none

cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval    0.5
cursor_stop_blinking_after 15.0

scrollback_lines        10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

mouse_hide_wait          3.0
url_style                curly
detect_urls              yes
copy_on_select            yes
strip_trailing_spaces     smart

repaint_delay    10
input_delay      3
sync_to_monitor  yes

enable_audio_bell        no
visual_bell_duration      0.15
window_alert_on_bell      yes
bell_on_tab               "🔔 "

remember_window_size   yes
initial_window_width   1100
initial_window_height  700
window_padding_width   16 12 12 16
window_margin_width    0
hide_window_decorations yes
confirm_os_window_close 0
# active_border_color    #7aa2f7
# inactive_border_color  #414868
# bell_border_color      #e0af68

tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
tab_title_template    "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal
# active_tab_foreground   #1a1b26
# active_tab_background   #7aa2f7
# inactive_tab_foreground #a9b1d6
# inactive_tab_background #24283b
# foreground              #c0caf5
# background               #1a1b26
# selection_foreground     #1a1b26
# selection_background     #c0caf5
# cursor            #c0caf5
# cursor_text_color #1a1b26
# url_color #73daca
# color0  #15161e
# color8  #414868
# color1  #f7768e
# color9  #f7768e
# color2  #9ece6a
# color10 #9ece6a
# color3  #e0af68
# color11 #e0af68
# color4  #7aa2f7
# color12 #7aa2f7
# color5  #bb9af7
# color13 #bb9af7
# color6  #7dcfff
# color14 #7dcfff
# color7  #a9b1d6
# color15 #c0caf5

background_opacity 1.0
dynamic_background_opacity no

shell         zsh
editor        nano
close_on_child_death no
allow_remote_control yes
update_check_interval 0

kitty_mod ctrl+shift

map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

map kitty_mod+t          new_tab
map kitty_mod+w          close_tab
map kitty_mod+right      next_tab
map kitty_mod+left       previous_tab
map kitty_mod+1          goto_tab 1
map kitty_mod+2          goto_tab 2
map kitty_mod+3          goto_tab 3
map kitty_mod+4          goto_tab 4
map kitty_mod+5          goto_tab 5
map kitty_mod+.          move_tab_forward
map kitty_mod+,          move_tab_backward

map kitty_mod+enter       new_window
map kitty_mod+q           close_window
map kitty_mod+]           next_window
map kitty_mod+[           previous_window
map kitty_mod+f5          load_config_file
map ctrl+alt+t            launch --location=hsplit
map ctrl+alt+s             launch --location=vsplit
map ctrl+alt+left          neighboring_window left
map ctrl+alt+right         neighboring_window right
map ctrl+alt+up            neighboring_window up
map ctrl+alt+down          neighboring_window down

map kitty_mod+equal      change_font_size all +1.0
map kitty_mod+minus      change_font_size all -1.0
map kitty_mod+backspace  change_font_size all 0

map kitty_mod+l next_layout

map kitty_mod+home scroll_home
map kitty_mod+end  scroll_end
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down

map kitty_mod+u kitten unicode_input
map kitty_mod+e open_url_with_hints
map kitty_mod+p>f kitten hints --type path --program -
symbol_map U+1F300-U+1FAFF,U+2600-U+26FF Noto Color Emoji


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME