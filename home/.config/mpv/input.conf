# ── Mouse ─────────────────────────────────────────────
mbtn_right       script-binding uosc/menu
mbtn_left_dbl    cycle fullscreen
wheel_up         osd-msg add volume 5
wheel_down       osd-msg add volume -5

# ── Playback ──────────────────────────────────────────
space            cycle pause                                  #! Play / Pause
ctrl+ESC         stop                                         #! Stop
ctrl+shift+LEFT  seek 0 absolute                              #! Jump to beginning
LEFT             seek -2
RIGHT            seek  2
shift+LEFT       seek -30
shift+RIGHT      seek  30
ctrl+RIGHT       script-binding uosc/next                     #! Next
ctrl+LEFT        script-binding uosc/prev                     #! Previous
ctrl+alt+RIGHT   frame-step                                   #! Frame > Next frame
ctrl+alt+LEFT    frame-back-step                              #! Frame > Previous frame
c                osd-msg add chapter 1                        #! Next chapter
C                osd-msg add chapter -1                       #! Previous chapter
ctrl+alt+l       script-binding uosc/chapters                 #! Chapters list

# ── Speed: steps of 0.1 (add / subtract) ──────────────
ctrl+]           osd-msg add speed  0.1                       #! Speed > Faster (+0.1)
ctrl+[           osd-msg add speed -0.1                       #! Speed > Slower (-0.1)
ctrl+\           osd-msg set speed 1.0                        #! Speed > Normal
]                osd-msg add speed  0.1
[                osd-msg add speed -0.1
\                osd-msg set speed 1.0

# ── A-B loop ──────────────────────────────────────────
ctrl+shift+b     osd-msg set ab-loop-a ${=time-pos}           #! A-B loop > Set start
ctrl+shift+e     osd-msg set ab-loop-b ${=time-pos}           #! A-B loop > Set end
ctrl+shift+c     set ab-loop-a no; osd-msg set ab-loop-b no   #! A-B loop > Cancel

# ── View ──────────────────────────────────────────────
ctrl+f           cycle fullscreen                             #! View > Fullscreen
f                cycle fullscreen
ESC              set fullscreen no
ctrl+t           osd-msg cycle ontop                          #! View > Float on top
ctrl+0           set window-scale 0.5                         #! View > Half size
ctrl+1           set window-scale 1.0                         #! View > Normal size
ctrl+2           set window-scale 2.0                         #! View > Double size
ctrl+alt+m       vf toggle hflip                              #! View > Mirror
ctrl+alt+f       vf toggle vflip                              #! View > Flip
ctrl+alt+c       script-binding uosc/toggle-ui                #! View > Show / hide timeline
ctrl+l           script-binding uosc/playlist                 #! Playlist
ctrl+o           script-binding uosc/open-file                #! Open file
ctrl+i           script-binding stats/display-stats-toggle    #! Media info
ctrl+alt+r       script-binding uosc/show-in-directory        #! Show in folder

# ── Audio ─────────────────────────────────────────────
ctrl+UP          osd-msg add volume  5                        #! Audio > Volume up
ctrl+DOWN        osd-msg add volume -5                        #! Audio > Volume down
UP               osd-msg add volume  5
DOWN             osd-msg add volume -5
ctrl+alt+DOWN    osd-msg cycle mute                           #! Audio > Mute
m                osd-msg cycle mute
a                osd-msg cycle audio                          #! Audio > Next audio track
ctrl+shift+]     osd-msg add audio-delay  0.1                 #! Audio > Delay +0.1s
ctrl+shift+[     osd-msg add audio-delay -0.1                 #! Audio > Delay -0.1s
ctrl+shift+\     osd-msg set audio-delay 0                    #! Audio > Reset delay

# ── Subtitles ─────────────────────────────────────────
s                osd-msg cycle sub                            #! Subtitles > Next track
alt+s            osd-msg cycle sub-visibility                 #! Subtitles > Show / hide
ctrl+=           osd-msg add sub-scale  0.1                   #! Subtitles > Bigger
ctrl+-           osd-msg add sub-scale -0.1                   #! Subtitles > Smaller
ctrl+alt+]       osd-msg add sub-delay  0.1                   #! Subtitles > Delay +0.1s
ctrl+alt+[       osd-msg add sub-delay -0.1                   #! Subtitles > Delay -0.1s
ctrl+alt+\       osd-msg set sub-delay 0                      #! Subtitles > Reset delay
alt+UP           osd-msg add sub-pos -1                       #! Subtitles > Move up
alt+DOWN         osd-msg add sub-pos  1                       #! Subtitles > Move down
#                script-binding uosc/download-subtitles       #! Subtitles > Download subtitles

# ── Other ─────────────────────────────────────────────
ctrl+alt+s       osd-msg screenshot                           #! Screenshot
ctrl+q           quit                                         #! Quit
ctrl+w           quit
